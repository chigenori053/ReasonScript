edition = "2021"
publish = false

[lib]
name = "reasonscript_vision_runtime"
path = "src/lib.rs"

[[bin]]
name = "reason-vision"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

