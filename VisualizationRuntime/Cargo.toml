[package]
name = "reasonscript-semantic-visualization-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "reasonscript_semantic_visualization_runtime"
path = "src/lib.rs"

[[bin]]
name = "reason-visualization"
path = "src/main.rs"

[dependencies]
reasonscript-vision-runtime = { path = "../VisionRuntime" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
