name: CI Stabilization

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config
      - run: python3 -m pip install --upgrade pip
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Fetch Rust dependencies
        run: |
          for manifest in ReasonRuntime/Cargo.toml apps/reasonscript-ide/src-tauri/Cargo.toml; do
            if [ -f "$manifest" ]; then
              cargo fetch --manifest-path "$manifest"
            fi
          done
      - name: Build native runtime host
        run: cargo build --manifest-path ReasonRuntime/Cargo.toml --bin reason-runtime-host
      - run: ./reason ci --json --out .
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            ci_report.json
            ci_summary.json
