name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 -m pip install --upgrade pip
      - run: python3 -m pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: vscode-extension
      - run: python3 scripts/test_platform.py release-check --quick
      - name: Build official install and update package
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          python3 scripts/build_update_package.py \
            --version "$(cat VERSION)" \
            --platform macos --architecture arm64 --format zip \
            --package-class release --expected-commit "${GITHUB_SHA}" \
            --out dist --json
          ./reason update package-validate "dist/reasonscript-$(cat VERSION)-macos-arm64.zip" --json
      - name: Validate tag and package checksums
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          cd dist
          shasum -a 256 -c "reasonscript-$(cat ../VERSION)-macos-arm64.zip.sha256"
          shasum -a 256 "reasonscript-$(cat ../VERSION)-macos-arm64.manifest.json" | cut -d ' ' -f 1 | diff - "reasonscript-$(cat ../VERSION)-macos-arm64.manifest.sha256"
      - run: npm run package
        working-directory: vscode-extension
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            VERSION
            docs
            golden
            vscode-extension/reasonscript-0.1.7.vsix
            dist/reasonscript-*.zip
            dist/reasonscript-*.sha256
            dist/reasonscript-*.manifest.json
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/reasonscript-*.zip
            dist/reasonscript-*.sha256
            dist/reasonscript-*.manifest.json
            vscode-extension/reasonscript-0.1.7.vsix
