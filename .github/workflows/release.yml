name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 -m pip install --upgrade pip
      - run: python3 -m pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: vscode-extension
      - run: npm run package
        working-directory: vscode-extension
      - run: python3 scripts/test_platform.py release-check --quick
      - name: Validate tag and package checksums
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          cd "release/${GITHUB_REF_NAME}"
          shasum -a 256 -c "reasonscript-$(cat ../../VERSION)-macos-arm64.zip.sha256"
          shasum -a 256 "reasonscript-$(cat ../../VERSION)-macos-arm64.manifest.json" | cut -d ' ' -f 1 | diff - "reasonscript-$(cat ../../VERSION)-macos-arm64.manifest.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            VERSION
            docs
            golden
            vscode-extension/reasonscript-0.1.7.vsix
            release/${{ github.ref_name }}/reasonscript-*.zip
            release/${{ github.ref_name }}/reasonscript-*.sha256
            release/${{ github.ref_name }}/reasonscript-*.manifest.json
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/${{ github.ref_name }}/reasonscript-*.zip
            release/${{ github.ref_name }}/reasonscript-*.sha256
            release/${{ github.ref_name }}/reasonscript-*.manifest.json
            vscode-extension/reasonscript-0.1.7.vsix
