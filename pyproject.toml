[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reasonscript"
version = "0.5.5.13"
description = "ReasonScript CLI and runtime"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["pydantic>=2,<3"]

[project.scripts]
reason = "toolchain.__main__:main"

[project.optional-dependencies]
visualization = ["matplotlib>=3.8,<4"]
playground = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
viewer = ["windows-curses>=2.3; sys_platform == 'win32'"]
full = ["matplotlib>=3.8,<4", "fastapi>=0.110,<1", "uvicorn>=0.29,<1", "windows-curses>=2.3; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
include = ["toolchain*", "runtime*", "frontend*", "playground*", "conformance*", "sdk*"]

[tool.setuptools.package-data]
toolchain = ["../VERSION", "../schemas/*.json", "../examples/**/*.rsn"]
frontend = ["schemas/*.json"]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
]
ignore = [
  "E402",
  "E701",
  "E702",
  "E741",
  "F401",
  "F841",
]
