[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasonscript"
version = "0.5.4.4"
description = "ReasonScript CLI and runtime"
requires-python = ">=3.11"

[project.scripts]
reason = "toolchain.__main__:main"

[project.optional-dependencies]
visualization = ["matplotlib>=3.8,<4"]
viewer = ["windows-curses>=2.3; sys_platform == 'win32'"]
full = ["matplotlib>=3.8,<4", "windows-curses>=2.3; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
include = ["toolchain*", "runtime*"]

[tool.setuptools.package-data]
toolchain = ["../VERSION", "../schemas/*.json", "../examples/**/*.rsn"]

[tool.ruff.lint]
ignore = [
  "E402",
  "E701",
  "E702",
  "E741",
  "F401",
  "F841",
]
